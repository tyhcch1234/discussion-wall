<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>討論牆 · 一起貼答案</title>
<meta name="description" content="像 Padlet 的討論牆：任何人只要開連結，就可以把答案貼上牆，即時同步給所有人。">
<meta name="theme-color" content="#F7F7FB">
<meta property="og:title" content="討論牆 · 一起貼答案">
<meta property="og:description" content="開連結就能貼答案，即時同步，適合課堂討論與腦力激盪。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235B5BD6'/><rect x='22' y='26' width='24' height='20' rx='5' fill='%23FFD86B'/><rect x='54' y='26' width='24' height='30' rx='5' fill='%23FF9FB8'/><rect x='22' y='54' width='24' height='22' rx='5' fill='%23A7E8C8'/><rect x='54' y='64' width='24' height='12' rx='5' fill='%23FFFFFF'/></svg>">
<style>
  :root{
    --bg:#F6F6FB;
    --bg-blur:rgba(246,246,251,.86);
    --panel:#FFFFFF;
    --panel-2:#FBFBFE;
    --text:#1B1A21;
    --muted:#6E6C7C;
    --line:#E7E6F0;
    --accent:#5B5BD6;
    --accent-2:#7C4DFF;
    --accent-soft:#EDEDFE;
    --danger:#D6455D;
    --shadow-sm:0 1px 2px rgba(24,23,40,.05), 0 2px 8px -4px rgba(24,23,40,.10);
    --shadow-md:0 2px 4px rgba(24,23,40,.04), 0 14px 34px -18px rgba(24,23,40,.28);
    --radius:18px;
    --radius-sm:12px;
  }
  html[data-theme="dark"]{
    --bg:#131217;
    --bg-blur:rgba(19,18,23,.86);
    --panel:#1C1B22;
    --panel-2:#232230;
    --text:#F3F2F7;
    --muted:#9D9BAC;
    --line:#2E2D3A;
    --accent:#8F8FFF;
    --accent-2:#B49CFF;
    --accent-soft:#25243A;
    --danger:#FF7B90;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 14px 34px -18px rgba(0,0,0,.8);
  }

  /* pastel card palettes */
  [data-color="lemon"]{--c-bg:#FFF7D9;--c-ink:#7A5A00;--c-accent:#E9B208;--c-soft:#FFF0B8}
  [data-color="rose"] {--c-bg:#FFE7EF;--c-ink:#8C2C4C;--c-accent:#E2568A;--c-soft:#FFD6E4}
  [data-color="mint"] {--c-bg:#DEF7EC;--c-ink:#0F6350;--c-accent:#12A57C;--c-soft:#C8F0DE}
  [data-color="sky"]  {--c-bg:#E3EEFF;--c-ink:#1A4380;--c-accent:#3B7DE8;--c-soft:#CFE2FF}
  [data-color="lilac"]{--c-bg:#EDE7FF;--c-ink:#4A2F8C;--c-accent:#7C4DFF;--c-soft:#DFD4FF}
  [data-color="peach"]{--c-bg:#FFEBDC;--c-ink:#7E3D14;--c-accent:#E1762F;--c-soft:#FFDCC2}
  html[data-theme="dark"] [data-color="lemon"]{--c-bg:#332C17;--c-ink:#FFE59B;--c-accent:#E9B208;--c-soft:#3F3620}
  html[data-theme="dark"] [data-color="rose"] {--c-bg:#3A2130;--c-ink:#FFC6D8;--c-accent:#E2568A;--c-soft:#46283A}
  html[data-theme="dark"] [data-color="mint"] {--c-bg:#15332B;--c-ink:#A8EBD2;--c-accent:#12A57C;--c-soft:#1B3F35}
  html[data-theme="dark"] [data-color="sky"]  {--c-bg:#1B2A40;--c-ink:#BCDCFF;--c-accent:#3B7DE8;--c-soft:#22344E}
  html[data-theme="dark"] [data-color="lilac"]{--c-bg:#282139;--c-ink:#D6C6FF;--c-accent:#7C4DFF;--c-soft:#322A46}
  html[data-theme="dark"] [data-color="peach"]{--c-bg:#3A2A1E;--c-ink:#FFD0AC;--c-accent:#E1762F;--c-soft:#453225}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    font-size:16px;line-height:1.55;
    padding-bottom:calc(150px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  ::selection{background:var(--accent-soft)}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;background:var(--bg-blur);
    -webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{max-width:1320px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow-sm)}
  .brand-mark span{display:block;width:16px;height:16px;border-radius:4px;background:
     linear-gradient(90deg,#FFD86B 0 42%,transparent 42% 58%,#FF9FB8 58% 100%),
     linear-gradient(180deg,transparent 0 46%,#A7E8C8 46% 100%);
     background-blend-mode:normal}
  .brand-title{font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  .spacer{flex:1}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    color:var(--muted);transition:background .15s,color .15s;flex:0 0 auto;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--text)}
  .icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chip{
    display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);
    font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;
  }
  .chip:hover{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
  .avatar{
    width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
    color:#fff;flex:0 0 auto;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .dot.off{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.16)}
  .dot.err{background:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.16)}
  .dot.busy{background:#6366F1;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- home: topic list ---------- */
  .home{max-width:1120px;margin:0 auto;padding:22px 18px 10px}
  .home-head{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
  .home-title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .home-title-row h1{margin:0;font-size:clamp(25px,5.2vw,36px);font-weight:800;letter-spacing:-.8px;line-height:1.15}
  .home-count{font-size:13px;font-weight:600;color:var(--muted)}
  .home-sub{margin:0;font-size:14.5px;color:var(--muted);max-width:60ch}
  .home-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px}
  @media (max-width:560px){.topics{grid-template-columns:1fr}}

  .topic{
    position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;
    padding:18px 16px 13px;border-radius:18px;min-height:158px;
    background:color-mix(in srgb, var(--c-bg) 42%, var(--panel));
    border:1px solid color-mix(in srgb, var(--c-accent) 20%, var(--line));
    box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .16s, box-shadow .16s, border-color .16s;
    overflow:hidden;
  }
  .topic:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb, var(--c-accent) 42%, var(--line))}
  .topic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topic .bar{position:absolute;left:0;right:0;top:0;height:4px;background:var(--c-accent);opacity:.85}
  .topic-top{display:flex;align-items:center;gap:8px}
  .topic .idx{
    width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
    background:var(--c-accent);color:#fff;font-size:12.5px;font-weight:800;
  }
  .topic .badge{
    font-size:11.5px;font-weight:700;color:var(--c-ink);
    background:color-mix(in srgb, var(--c-accent) 14%, transparent);
    padding:3px 8px;border-radius:20px;
  }
  .topic-admin{margin-left:auto;display:none;gap:4px}
  body.is-admin .topic-admin{display:flex}
  .topic-admin .mini{height:26px;padding:0 7px;font-size:12px;background:transparent;border-color:transparent}
  .topic h3{margin:0;font-size:16.5px;font-weight:750;line-height:1.38;color:var(--text);letter-spacing:-.1px}
  .topic .desc{
    margin:0;font-size:13px;line-height:1.55;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .topic .foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .topic .enter{margin-left:auto;font-weight:750;color:var(--c-accent);font-size:12.5px;white-space:nowrap}
  .topic.topic-add{
    align-items:center;justify-content:center;gap:6px;background:transparent;border:1.5px dashed var(--line);
    color:var(--muted);font-weight:650;font-size:14px;box-shadow:none;display:none;
  }
  .topic.topic-add:hover{border-color:var(--accent);color:var(--accent);transform:none}
  body.is-admin .topic.topic-add{display:flex}
  .home-empty{
    grid-column:1/-1;text-align:center;color:var(--muted);padding:44px 20px;
    border:1.5px dashed var(--line);border-radius:20px;background:var(--panel-2);
  }

  /* ---------- topic view ---------- */
  .topic-head{max-width:1320px;margin:0 auto;padding:12px 18px 0}
  .back{
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 8px;border-radius:9px;
    font-size:13px;font-weight:650;color:var(--muted);border:1px solid var(--line);background:var(--panel);
  }
  .back:hover{color:var(--text);border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
  .topic-desc{margin:6px 0 0;font-size:14.5px;color:var(--muted);max-width:70ch;line-height:1.6}
  body.view-home .composer-wrap{display:none}

  /* ---------- wall ---------- */
  .board-head{max-width:1320px;margin:0 auto;padding:6px 18px 0;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .board-title{font-size:clamp(22px,4.4vw,30px);font-weight:800;letter-spacing:-.4px;margin:0;line-height:1.2}
  .board-sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
  .board-tools{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .mini{
    height:32px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);
    border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px;
  }
  .mini:hover{color:var(--text);border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}
  .mini.active{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 55%, var(--line));background:var(--accent-soft)}
  .mini.danger:hover{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 45%, var(--line))}
  .only-admin{display:none!important}
  body.is-admin .only-admin{display:inline-flex!important}

  .wall{
    max-width:1320px;margin:0 auto;padding:18px;
    column-count:4;column-gap:16px;
  }
  @media (max-width:1180px){.wall{column-count:3}}
  @media (max-width:820px){.wall{column-count:2;column-gap:12px;padding:14px}}
  @media (max-width:520px){.wall{column-count:1;padding:12px}}

  .card{
    break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
    margin:0 0 14px;border-radius:var(--radius);background:var(--c-bg);color:var(--c-ink);
    border:1px solid color-mix(in srgb, var(--c-accent) 22%, transparent);
    box-shadow:var(--shadow-sm);padding:14px 15px 10px;position:relative;
  }
  .card.fresh{animation:pop .28s cubic-bezier(.2,.8,.3,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .card-name{font-size:13px;font-weight:700;color:var(--c-ink);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-time{font-size:11.5px;color:color-mix(in srgb, var(--c-ink) 55%, transparent);margin-left:auto;white-space:nowrap}
  .card-body{font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word;letter-spacing:.1px}
  .card-body a{color:var(--c-accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
  .card-foot{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid color-mix(in srgb, var(--c-accent) 16%, transparent)}
  .like{
    display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:20px;
    font-size:12.5px;font-weight:700;color:color-mix(in srgb, var(--c-ink) 70%, transparent);
    background:color-mix(in srgb, var(--c-accent) 8%, transparent);
  }
  .like svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .like.on{color:#fff;background:var(--c-accent)}
  .like.on svg{fill:currentColor;stroke:none}
  .like:active{transform:scale(.94)}
  .del{
    margin-left:auto;width:26px;height:26px;border-radius:8px;display:none;place-items:center;
    color:color-mix(in srgb, var(--c-ink) 60%, transparent);
  }
  .del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .card.mine .del{display:grid}
  body.is-admin .card .del{display:grid}
  .del:hover{background:rgba(0,0,0,.08);color:var(--danger)}
  .pin-flag{position:absolute;top:-8px;right:12px;font-size:14px}

  .empty{
    max-width:520px;margin:44px auto;text-align:center;color:var(--muted);
    padding:38px 22px;border:1.5px dashed var(--line);border-radius:22px;background:var(--panel-2);
  }
  .empty h3{margin:10px 0 6px;color:var(--text);font-size:17px}
  .empty p{margin:0;font-size:14px}
  .empty .big{font-size:34px;line-height:1}
  .loading{text-align:center;color:var(--muted);padding:48px 0;font-size:14px}

  /* ---------- composer ---------- */
  .composer-wrap{
    position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 42%, transparent);
    pointer-events:none;
  }
  .composer{
    pointer-events:auto;max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;box-shadow:var(--shadow-md);padding:11px 12px 10px;
    transition:border-color .15s, box-shadow .15s;
  }
  .composer:focus-within{border-color:color-mix(in srgb, var(--accent) 50%, var(--line));box-shadow:0 18px 40px -20px rgba(91,91,214,.55)}
  .composer textarea{
    width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15.5px;line-height:1.55;
    min-height:26px;max-height:170px;padding:2px 2px 6px;
  }
  .composer textarea::placeholder{color:var(--muted)}
  .composer-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .swatches{display:flex;gap:6px}
  .sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:.15s}
  .sw[data-c="lemon"]{background:#F7CE45}
  .sw[data-c="rose"]{background:#EE7CA4}
  .sw[data-c="mint"]{background:#2BB98D}
  .sw[data-c="sky"]{background:#5591EC}
  .sw[data-c="lilac"]{background:#8B62F0}
  .sw[data-c="peach"]{background:#EE8A45}
  .sw.on{border-color:var(--text);transform:scale(1.12)}
  .anon{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);user-select:none;cursor:pointer}
  .anon input{accent-color:var(--accent);width:15px;height:15px}
  .send{
    margin-left:auto;height:38px;padding:0 18px;border-radius:11px;background:var(--accent);color:#fff;
    font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 6px 16px -8px rgba(91,91,214,.9);transition:.15s;
  }
  .send:hover{filter:brightness(1.06)}
  .send:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
  .send svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .counter{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- modal ---------- */
  .modal-back{
    position:fixed;inset:0;z-index:90;background:rgba(18,17,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:18px;
  }
  .modal-back.show{display:flex;animation:fade .16s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:420px;background:var(--panel);border-radius:20px;padding:20px;
    box-shadow:0 30px 70px -24px rgba(20,18,40,.5);animation:pop .2s both;
  }
  .modal h3{margin:0 0 4px;font-size:18px;letter-spacing:-.2px}
  .modal p.hint{margin:0 0 14px;font-size:13px;color:var(--muted)}
  .field{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);
    padding:0 13px;outline:0;font-size:15px}
  .field:focus{border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
  .modal-actions{display:flex;gap:9px;margin-top:16px}
  .btn{height:42px;padding:0 16px;border-radius:11px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .btn.primary{background:var(--accent);color:#fff;flex:1}
  .btn.ghost{border:1px solid var(--line);color:var(--muted)}
  .btn.ghost:hover{color:var(--text)}
  .btn.warn{background:var(--danger);color:#fff}
  .color-pick{display:flex;gap:8px;margin-top:12px}

  /* ---------- toast ---------- */
  .toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{
    background:#22212B;color:#fff;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:99px;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.5);animation:pop .2s both;max-width:80vw;text-align:center;
  }
  .toast.err{background:#C63A50}
  .toast.ok{background:#138A63}

  .banner{
    max-width:1320px;margin:10px auto 0;padding:0 18px;display:none;
  }
  .banner.show{display:block}
  .banner-inner{
    display:flex;gap:10px;align-items:center;background:var(--accent-soft);border:1px solid var(--line);
    border-radius:12px;padding:9px 13px;font-size:13px;color:var(--text);
  }
  .banner-inner b{color:var(--accent)}

  @media (max-width:600px){
    .topbar-inner{padding:8px 13px 0;gap:8px}
    .brand-title{max-width:34vw;font-size:15px}
    .board-head{padding:4px 13px 0}
    .chip .label-text{display:none}
    .board-tools{margin-left:0;width:100%}
  }
  @media print{.topbar,.composer-wrap,.board-tools,.home-tools{display:none}}
</style>
</head>
<body class="view-home">
<!-- ======= TOP BAR ======= -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div class="brand-title" id="appTitle">討論牆</div>
    </div>
    <div class="spacer"></div>
    <button class="chip" id="nickBtn" title="更改你的名字">
      <span class="avatar" id="nickAvatar">?</span>
      <span class="label-text" id="nickLabel">設定名字</span>
    </button>

<div class="toasts" id="toasts"></div>
<script>
/* =========================================================
   討論牆 Discussion Wall — 單檔 Padlet 風格討論板
   儲存：免費雲端 KV（跨裝置即時共用）＋ 本機備援
   ========================================================= */

const CONFIG = {
  APP_TITLE: '討論牆',
  // 免費雲端儲存（kvdb.io bucket）。想換成自己的永久儲存，見 README。
  KVDB_BUCKET: '14pPD4kXQMCcoRxm3vt9Cx',
  // 管理員「初始」密碼。管理員可在網頁內自行改密碼（會存到雲端，所有裝置生效）。
  ADMIN_PASS: 'teach2026',
  // 忘記密碼時：把 ADMIN_PASS 改成新密碼，並把 AUTH_EPOCH +1，重新部署即可覆寫雲端密碼。
  AUTH_EPOCH: 1,
  POLL_MS: 12000,
  DEFAULT_TOPICS: [
    { id: 'b1', name: '本週討論', desc: '主持人可以在這裡提出題目，參加者撳入去就可以貼上自己嘅答案。', color: 'lilac' },
    { id: 'b2', name: '自由分享', desc: '任何想法、問題、參考資料都可以貼上嚟。', color: 'mint' }
  ],
  COLORS: ['lemon', 'rose', 'mint', 'sky', 'lilac', 'peach'],
  TOPIC_COLORS: ['lilac', 'mint', 'sky', 'lemon', 'rose', 'peach'],
  AVATAR_COLORS: ['#5B5BD6', '#E2568A', '#12A57C', '#3B7DE8', '#7C4DFF', '#E1762F', '#0EA5A5', '#C2410C']
};

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function linkify(text) {
  const safe = esc(text);
  return safe.replace(/(https?:\/\/[^\s<>"')]+)/g, (m) => {
    const clean = m.replace(/[.,;:!?)]+$/, '');
    const tail = m.slice(clean.length);
    return '<a href="' + clean + '" target="_blank" rel="noopener noreferrer">' + clean + '</a>' + tail;
  });
}

function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 45e3) return '剛剛';
  if (d < 36e5) return Math.floor(d / 6e4) + ' 分鐘前';
  if (d < 864e5) return Math.floor(d / 36e5) + ' 小時前';
  if (d < 1728e5) return '昨天';
  if (d < 6048e5) return Math.floor(d / 864e5) + ' 日前';
  const dt = new Date(ts);
  return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
}

function avatarFor(name) {
  const n = String(name || '?').trim();
  let h = 0;
  for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 997;
  return { letter: n.slice(0, 1).toUpperCase(), color: CONFIG.AVATAR_COLORS[h % CONFIG.AVATAR_COLORS.length] };
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; }, 2100);
  setTimeout(() => el.remove(), 2500);
}

function openModal(id) { $('#' + id).classList.add('show'); }
function closeModal(id) { $('#' + id).classList.remove('show'); }
function closeAllModals() { $$('.modal-back').forEach((m) => m.classList.remove('show')); }

/* ---------------- storage: cloud (kvdb.io) ---------------- */
function makeCloudStore(bucket) {
  const base = 'https://kvdb.io/' + bucket;
  async function req(url, opts) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 9000);
    try {
      return await fetch(url, Object.assign({ signal: ctl.signal, cache: 'no-store' }, opts || {}));
    } finally { clearTimeout(t); }
  }
  return {
    mode: 'cloud',
    async listKeys(prefix) {
      // cache-buster：避免 CDN 邊緣快取回舊清單
      const r = await req(base + '/?prefix=' + encodeURIComponent(prefix) + '&limit=1000&_=' + Date.now());
      if (!r.ok) throw new Error('list ' + r.status);
      const txt = await r.text();
      return txt.split('\n').map((s) => s.trim()).filter(Boolean);
    },
    async get(key) {
      const r = await req(base + '/' + encodeURIComponent(key) + '?_=' + Date.now());
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('get ' + r.status);
      const txt = await r.text();
      if (!txt) return null;
      try { return JSON.parse(txt); } catch (e) { return null; }
    },
    async put(key, val) {
      const r = await req(base + '/' + encodeURIComponent(key), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val)
      });
      if (!r.ok) throw new Error('put ' + r.status);
      return true;
    },
    async del(key) {
      const r = await req(base + '/' + encodeURIComponent(key), { method: 'DELETE' });
      if (!r.ok && r.status !== 404) throw new Error('del ' + r.status);
      return true;
    }
  };
}

/* ---------------- storage: local fallback ---------------- */
function makeLocalStore() {
  const NS = 'pwall:kv:';
  const all = () => { try { return JSON.parse(localStorage.getItem(NS) || '{}'); } catch (e) { return {}; } };
  const save = (o) => localStorage.setItem(NS, JSON.stringify(o));
  return {
    mode: 'local',
    async listKeys(prefix) { return Object.keys(all()).filter((k) => k.startsWith(prefix)); },
    async get(key) { const o = all(); return key in o ? o[key] : null; },
    async put(key, val) { const o = all(); o[key] = val; save(o); return true; },
    async del(key) { const o = all(); delete o[key]; save(o); return true; }
  };
}
</script>
<script>
/* ---------------- app state ---------------- */
const S = {
  store: null,
  topics: [],
  topicId: null,
  view: 'home',
  posts: new Map(),
  pending: new Set(),
  stats: {},
  sort: localStorage.getItem('pwall:sort') || 'new',
  color: localStorage.getItem('pwall:color') || 'lemon',
  admin: localStorage.getItem('pwall:admin') === '1',
  uid: (function () {
    let v = localStorage.getItem('pwall:uid');
    if (!v) { v = uid(); localStorage.setItem('pwall:uid', v); }
    return v;
  })(),
  name: localStorage.getItem('pwall:name') || '',
  busy: false,
  loading: true,
  tick: 0,
  confirmFn: null,
  pendingSubmit: false,
  homeSig: ''
};
if (!S.name) {
  S.name = '訪客' + S.uid.slice(-3).toUpperCase();
  localStorage.setItem('pwall:name', S.name);
}

const PREFIX = (tid) => 'p:' + tid + ':';
const K_TOPICS = 'cfg:topics';
const K_LEGACY = 'cfg:boards';
const K_AUTH = 'cfg:auth';

async function mapLimit(arr, limit, fn) {
  const out = new Array(arr.length);
  let i = 0;
  const workers = new Array(Math.min(limit, arr.length || 1)).fill(0).map(async () => {
    while (i < arr.length) {
      const idx = i++;
      try { out[idx] = await fn(arr[idx], idx); } catch (e) { out[idx] = null; }
    }
  });
  await Promise.all(workers);
  return out;
}

function setStatus(kind, text) {
  const dot = $('#statusDot'), lbl = $('#statusText');
  dot.className = 'dot' + (kind === 'ok' ? '' : kind === 'busy' ? ' busy' : kind === 'off' ? ' off' : ' err');
  lbl.textContent = text;
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('pwall:theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#131217' : '#F6F6FB');
}

/* ---------------- admin password ---------------- */
function hasSubtle() {
  return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.digest);
}

/* alg: 不指定＝自動選擇；指定 'sha256' 但環境不支援時回傳 null */
async function hashPass(pw, salt, alg) {
  const wantSha = alg ? alg === 'sha256' : hasSubtle();
  if (wantSha) {
    if (!hasSubtle()) return null;
    const data = new TextEncoder().encode(salt + ':' + pw);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return { alg: 'sha256', hash: Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('') };
  }
  // 非 https 環境（例如直接開檔案）的備援雜湊，只作防呆用
  const data = new TextEncoder().encode(salt + ':' + pw);
  let h1 = 0x811c9dc5 >>> 0;
  for (let i = 0; i < data.length; i++) h1 = Math.imul(h1 ^ data[i], 16777619) >>> 0;
  return { alg: 'fnv1a', hash: 'fb' + h1.toString(16) };
}

async function getAuthRecord() {
  try {
    const a = await S.store.get(K_AUTH);
    if (a && a.hash && a.epoch === CONFIG.AUTH_EPOCH) return a;
  } catch (e) {}
  return null;
}

async function checkPass(pw) {
  const a = await getAuthRecord();
  if (!a) return pw === CONFIG.ADMIN_PASS;
  const r = await hashPass(pw, a.salt, a.alg || 'fnv1a');
  if (!r) { toast('此瀏覽器無法驗證密碼，請用 https 開啟本頁', 'err'); return false; }
  return r.hash === a.hash;
}

async function authInfoText() {
  try {
    const a = await getAuthRecord();
    if (!a) return '密碼來源：預設（' + CONFIG.ADMIN_PASS + '）';
    const d = new Date(a.updatedAt || 0);
    const pad = (n) => String(n).padStart(2, '0');
    return '密碼來源：自訂（' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' 更新）';
  } catch (e) { return ''; }
}

/* ---------------- topics ---------------- */
async function loadTopics(silent) {
  let topics = null;
  try { topics = await S.store.get(K_TOPICS); } catch (e) { /* offline */ }
  if (!Array.isArray(topics) || topics.length === 0) {
    if (silent) return;
    let legacy = null;
    try { legacy = await S.store.get(K_LEGACY); } catch (e) {}
    if (Array.isArray(legacy) && legacy.length) {
      // 由舊版（討論板）升級
      topics = legacy.map((t) => ({ id: t.id, name: t.name, desc: t.desc || '', color: t.color || 'lilac', createdAt: t.createdAt || Date.now() }));
    } else {
      topics = CONFIG.DEFAULT_TOPICS.map((t, i) => ({ id: t.id, name: t.name, desc: t.desc, color: t.color, createdAt: Date.now() + i }));
      await seedDemo(topics[0].id);
    }
    try { await S.store.put(K_TOPICS, topics); } catch (e) {}
  }
  S.topics = topics;
  return topics;
}

async function seedDemo(topicId) {
  const demos = [
    { n: '小提示', t: '主持人可以喺 ⚙️ 出題，參加者撳入題目就可以貼上自己嘅答案 🎉', c: 'mint' },
    { n: '小提示', t: '每條題目下面可以貼多張卡片，仲可以揀顏色、按 ❤️ 讚好。', c: 'lilac' }
  ];
  for (let i = 0; i < demos.length; i++) {
    const d = demos[i];
    await S.store.put(PREFIX(topicId) + 'demo' + i, {
      id: 'demo' + i, b: topicId, n: d.n, t: d.t, c: d.c, ts: Date.now() - (i + 1) * 60000, l: [], demo: 1
    }).catch(() => {});
  }
}

/* 用 key 統計每個題目的答案數與最後更新（一次 list 搞定） */
async function loadStats() {
  try {
    const keys = await S.store.listKeys('p:');
    const st = {};
    keys.forEach((k) => {
      const parts = k.split(':');
      if (parts.length < 3) return;
      const tid = parts[1], pid = parts[2];
      const o = st[tid] || (st[tid] = { n: 0, last: 0 });
      o.n++;
      const ts = parseInt(pid.slice(0, 8), 36);
      if (ts > 1.5e12 && ts < 2.5e12) o.last = Math.max(o.last, ts);
    });
    S.stats = st;
  } catch (e) { /* ignore */ }
}

/* ---------------- posts ---------------- */
async function loadPosts(force) {
  if (!S.topicId) return;
  const prefix = PREFIX(S.topicId);
  setStatus('busy', '同步中');
  try {
    const keys = await S.store.listKeys(prefix);
    const ids = keys.map((k) => k.slice(prefix.length)).filter(Boolean);
    const missing = ids.filter((id) => !S.posts.has(id));
    const fetched = await mapLimit(missing, 6, (id) => S.store.get(prefix + id));
    fetched.forEach((p, i) => {
      if (!p) return;
      if (!p.id) p.id = missing[i];
      S.posts.set(missing[i], p);
    });
    const live = new Set(ids);
    Array.from(S.posts.keys()).forEach((id) => {
      if (live.has(id) || S.pending.has(id)) return;
      const p = S.posts.get(id);
      if (p && Date.now() - p.ts < 8000) return; // 剛貼上，等雲端清單追上
      S.posts.delete(id);
    });
    S.loading = false;
    setStatus(S.store.mode === 'local' ? 'off' : 'ok', S.store.mode === 'local' ? '本機模式' : '已同步');
    renderTopic();
  } catch (e) {
    S.loading = false;
    renderTopic();
    setStatus('err', '連線失敗');
    if (force) toast('同步失敗，請檢查網絡', 'err');
  }
}

function sortedPosts() {
  const arr = Array.from(S.posts.values());
  if (S.sort === 'hot') arr.sort((a, b) => ((b.l || []).length - (a.l || []).length) || (b.ts - a.ts));
  else arr.sort((a, b) => b.ts - a.ts);
  return arr;
}

/* ---------------- render: home ---------------- */
function renderHome(force) {
  const total = Object.values(S.stats).reduce((a, b) => a + (b.n || 0), 0);
  $('#homeCount').textContent = S.topics.length + ' 個題目 · ' + total + ' 張答案';

  const sig = S.topics.map((t) => t.id + t.name + (t.desc || '') + (t.color || '')).join('|') + '#' + JSON.stringify(S.stats);
  if (!force && sig === S.homeSig) return;
  S.homeSig = sig;

  if (!S.topics.length) {
    $('#topics').innerHTML = '<div class="home-empty">仲未有題目。' +
      (S.admin ? '撳「＋ 新增題目」開始出題。' : '等主持人出題…') + '</div>';
    return;
  }

  const cards = S.topics.map((t, i) => {
    const st = S.stats[t.id] || { n: 0, last: 0 };
    const desc = t.desc ? esc(t.desc) : '<span style="opacity:.6">未加說明</span>';
    const time = st.last ? '最後更新 ' + timeAgo(st.last) : '未有答案';
    return '<article class="topic" data-color="' + esc(t.color || 'lilac') + '" data-id="' + esc(t.id) + '" tabindex="0" role="button">' +
      '<span class="bar"></span>' +
      '<div class="topic-top">' +
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="badge">' + st.n + ' 張答案</span>' +
        '<div class="topic-admin">' +
          '<button class="mini" data-act="edit" title="編輯題目">✏️</button>' +
          '<button class="mini danger" data-act="del" title="刪除題目">🗑</button>' +
        '</div>' +
      '</div>' +
      '<h3>' + esc(t.name) + '</h3>' +
      '<p class="desc">' + desc + '</p>' +
      '<div class="foot"><span>' + time + '</span><span class="enter">進入 →</span></div>' +
    '</article>';
  }).join('');

  $('#topics').innerHTML = cards + '<button class="topic topic-add" id="topicAdd">＋ 新增題目</button>';
}

/* ---------------- render: topic ---------------- */
let lastSig = '';
const seenIds = new Set();

function renderTopic() {
  const t = S.topics.find((x) => x.id === S.topicId);
  $('#boardTitle').textContent = t ? t.name : '';
  const desc = $('#boardDesc');
  desc.textContent = t && t.desc ? t.desc : '';
  desc.hidden = !(t && t.desc);
  const n = S.posts.size;
  const modeTxt = S.store && S.store.mode === 'local' ? '儲存在這部裝置' : '即時同步';
  $('#boardSub').textContent = n ? n + ' 張答案 · ' + modeTxt : '仲未有答案，做第一個貼上牆嘅人';
  renderWall(false);
}

function renderWall(force) {
  const posts = sortedPosts();
  const wall = $('#wall');
  const empty = $('#emptyState');

  if (S.loading) {
    empty.innerHTML = '';
    wall.innerHTML = '<div class="loading">載入中…</div>';
    return;
  }
  const sig = posts.length + '#' + S.sort + '#' + S.uid + '#' +
    posts.map((p) => p.id + p.ts + (p.t || '').length + ((p.l || []).length) + (p.n || '') + (p.c || '')).join('|');
  if (!force && sig === lastSig) return;
  lastSig = sig;

  if (!posts.length) {
    wall.innerHTML = '';
    empty.innerHTML = '<div class="empty"><div class="big">🗒️</div><h3>這條題目仲未有答案</h3>' +
      '<p>在下面輸入你嘅想法，按「貼上牆」，就會出現在這裡。</p></div>';
    return;
  }
  empty.innerHTML = '';
  wall.innerHTML = posts.map((p) => {
    const av = avatarFor(p.n || '匿名');
    const liked = (p.l || []).indexOf(S.uid) >= 0;
    const likeCount = (p.l || []).length;
    const mine = p.uid === S.uid;
    const isFresh = !seenIds.has(p.id);
    seenIds.add(p.id);
    return '<article class="card' + (mine ? ' mine' : '') + (isFresh ? ' fresh' : '') + '" data-color="' + esc(p.c || 'lemon') + '" data-id="' + esc(p.id) + '">' +
      '<div class="card-top">' +
        '<span class="avatar" style="background:' + av.color + '">' + esc(av.letter) + '</span>' +
        '<span class="card-name">' + esc(p.n || '匿名') + '</span>' +
        '<span class="card-time">' + timeAgo(p.ts) + '</span>' +
      '</div>' +
      '<div class="card-body">' + linkify(p.t) + '</div>' +
      '<div class="card-foot">' +
        '<button class="like' + (liked ? ' on' : '') + '" data-act="like">' +
          '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
          (likeCount ? '<span>' + likeCount + '</span>' : '') +
        '</button>' +
        '<button class="del" data-act="del" title="刪除">' +
          '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>' +
        '</button>' +
      '</div>' +
    '</article>';
  }).join('');
}

/* ---------------- navigation ---------------- */
function showHome(push) {
  S.view = 'home';
  S.topicId = null;
  document.body.classList.add('view-home');
  $('#homeView').hidden = false;
  $('#topicView').hidden = true;
  renderHome(true);
  if (push !== false) { try { history.pushState({}, '', location.pathname + location.search); } catch (e) {} }
  loadStats().then(() => renderHome(true));
  try { window.scrollTo(0, 0); } catch (e) {}
}

function showTopic(id, push) {
  const t = S.topics.find((x) => x.id === id);
  if (!t) { showHome(push); return; }
  const changed = S.topicId !== id;
  S.topicId = id;
  S.view = 'topic';
  document.body.classList.remove('view-home');
  $('#homeView').hidden = true;
  $('#topicView').hidden = false;
  if (changed) { S.posts.clear(); seenIds.clear(); lastSig = ''; S.loading = true; }
  renderTopic();
  if (push !== false) { try { history.pushState({ t: id }, '', '#t=' + id); } catch (e) {} }
  if (changed) loadPosts(false);
  try { window.scrollTo(0, 0); } catch (e) {}
}

function route() {
  const raw = (location.hash.match(/#t=([^&]+)/) || [])[1];
  const id = raw ? decodeURIComponent(raw) : '';
  if (id && S.topics.some((t) => t.id === id)) showTopic(id, false);
  else showHome(false);
}

/* ---------------- actions: posts ---------------- */
async function submitPost() {
  const ta = $('#postText');
  const text = ta.value.trim();
  if (!text || !S.topicId) return;
  if (!S.name) { S.pendingSubmit = true; openModal('nickModal'); return; }
  const anon = $('#anonBox').checked;
  const id = uid();
  const post = {
    id: id, b: S.topicId, n: anon ? '匿名' : S.name, t: text,
    c: S.color, ts: Date.now(), l: [], uid: S.uid
  };
  S.posts.set(id, post);
  S.pending.add(id);
  S.loading = false;
  renderTopic();
  ta.value = ''; ta.style.height = 'auto';
  updateComposer();
  localStorage.removeItem('pwall:draft');
  const st = S.stats[S.topicId] || (S.stats[S.topicId] = { n: 0, last: 0 });
  st.n += 1; st.last = post.ts;
  try {
    await S.store.put(PREFIX(S.topicId) + id, post);
    setTimeout(() => S.pending.delete(id), 2500);
    setStatus(S.store.mode === 'local' ? 'off' : 'ok', S.store.mode === 'local' ? '本機模式' : '已同步');
  } catch (e) {
    S.pending.delete(id);
    S.posts.delete(id);
    st.n = Math.max(0, st.n - 1);
    renderTopic();
    ta.value = text;
    updateComposer();
    toast('發佈失敗，答案已幫你留住，請再試一次', 'err');
  }
}

async function toggleLike(id) {
  const p = S.posts.get(id);
  if (!p) return;
  p.l = p.l || [];
  const i = p.l.indexOf(S.uid);
  if (i >= 0) p.l.splice(i, 1); else p.l.push(S.uid);
  renderWall(true);
  try { await S.store.put(PREFIX(S.topicId) + id, p); } catch (e) { toast('讚好未能同步', 'err'); }
}

async function deletePost(id) {
  S.posts.delete(id);
  const st = S.stats[S.topicId];
  if (st) st.n = Math.max(0, st.n - 1);
  renderTopic();
  try { await S.store.del(PREFIX(S.topicId) + id); toast('已刪除', 'ok'); }
  catch (e) { toast('刪除失敗', 'err'); }
}

/* ---------------- actions: topics ---------------- */
let topicMode = 'create';
let topicEditId = null;
let topicColor = 'lilac';

function paintTopicColors() {
  $$('#topicColors .sw').forEach((s) => s.classList.toggle('on', s.dataset.c === topicColor));
}

function openTopicModal(mode, id) {
  topicMode = mode;
  topicEditId = id || null;
  const t = id ? S.topics.find((x) => x.id === id) : null;
  $('#topicModalTitle').textContent = mode === 'create' ? '新增題目' : '編輯題目';
  $('#topicNameInput').value = t ? t.name : '';
  $('#topicDescInput').value = t ? (t.desc || '') : '';
  topicColor = t ? (t.color || 'lilac') : 'lilac';
  $('#topicColors').innerHTML = CONFIG.TOPIC_COLORS.map((c) => '<button class="sw" data-c="' + c + '"></button>').join('');
  paintTopicColors();
  openModal('topicModal');
  setTimeout(() => $('#topicNameInput').focus(), 60);
}

async function saveTopic() {
  const name = $('#topicNameInput').value.trim();
  const desc = $('#topicDescInput').value.trim();
  if (!name) { toast('請輸入題目名稱', 'err'); return; }
  closeModal('topicModal');
  try {
    if (topicMode === 'create') {
      const t = { id: uid(), name: name.slice(0, 60), desc: desc.slice(0, 300), color: topicColor, createdAt: Date.now() };
      S.topics.push(t);
      await S.store.put(K_TOPICS, S.topics);
      renderHome(true);
      showTopic(t.id);
      toast('已新增題目', 'ok');
    } else {
      const t = S.topics.find((x) => x.id === topicEditId);
      if (!t) return;
      t.name = name.slice(0, 60);
      t.desc = desc.slice(0, 300);
      t.color = topicColor;
      await S.store.put(K_TOPICS, S.topics);
      if (S.view === 'topic') renderTopic(); else renderHome(true);
      toast('已更新題目', 'ok');
    }
  } catch (e) { toast('儲存失敗，請重試', 'err'); }
}

async function deleteTopic(id) {
  try {
    const prefix = PREFIX(id);
    const keys = await S.store.listKeys(prefix).catch(() => []);
    await Promise.all(keys.map((k) => S.store.del(k).catch(() => {})));
    S.topics = S.topics.filter((t) => t.id !== id);
    await S.store.put(K_TOPICS, S.topics);
    delete S.stats[id];
    if (S.topicId === id) { S.posts.clear(); showHome(); }
    else renderHome(true);
    toast('題目已刪除', 'ok');
  } catch (e) { toast('刪除失敗', 'err'); }
}

/* ---------------- composer ---------------- */
function updateComposer() {
  const ta = $('#postText');
  const len = ta.value.trim().length;
  $('#counter').textContent = len ? len + '/1200' : '';
  $('#sendBtn').disabled = len === 0;
  $$('#swatches .sw').forEach((s) => s.classList.toggle('on', s.dataset.c === S.color));
}

/* ---------------- events ---------------- */
function askConfirm(title, text, fn) {
  $('#confirmTitle').textContent = title;
  $('#confirmText').textContent = text;
  S.confirmFn = fn;
  openModal('confirmModal');
}

function bindEvents() {
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  $('#nickBtn').addEventListener('click', () => {
    $('#nickInput').value = S.name;
    openModal('nickModal');
    setTimeout(() => $('#nickInput').focus(), 60);
  });
  $('#nickSave').addEventListener('click', () => {
    const v = $('#nickInput').value.trim();
    if (!v) { toast('請輸入名字', 'err'); return; }
    S.name = v.slice(0, 20);
    localStorage.setItem('pwall:name', S.name);
    $('#nickLabel').textContent = S.name;
    const av = avatarFor(S.name);
    $('#nickAvatar').textContent = av.letter;
    $('#nickAvatar').style.background = av.color;
    closeModal('nickModal');
    toast('已更新名字', 'ok');
    if (S.pendingSubmit) { S.pendingSubmit = false; submitPost(); }
  });
  $('#nickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#nickSave').click(); });

  $('#statusBtn').addEventListener('click', () => {
    toast(S.store.mode === 'cloud' ? '雲端共用中：所有人貼上嘅答案會即時同步' : '本機模式：只儲存在這部裝置', 'ok');
  });

  /* admin */
  $('#adminBtn').addEventListener('click', () => {
    if (S.admin) { openModal('settingsModal'); refreshAuthInfo(); }
    else { $('#passInput').value = ''; openModal('adminModal'); setTimeout(() => $('#passInput').focus(), 60); }
  });
  $('#passOk').addEventListener('click', async () => {
    const btn = $('#passOk');
    btn.disabled = true;
    try {
      if (await checkPass($('#passInput').value)) {
        S.admin = true;
        localStorage.setItem('pwall:admin', '1');
        document.body.classList.add('is-admin');
        closeModal('adminModal');
        renderHome(true);
        toast('已進入管理員模式', 'ok');
        openModal('settingsModal');
        refreshAuthInfo();
      } else { toast('密碼不正確', 'err'); }
    } finally { btn.disabled = false; }
  });
  $('#passInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#passOk').click(); });
  $('#changePassBtn').addEventListener('click', () => {
    $('#curPass').value = ''; $('#newPass').value = ''; $('#newPass2').value = '';
    closeModal('settingsModal');
    openModal('passChangeModal');
    setTimeout(() => $('#curPass').focus(), 60);
  });
  $('#savePassBtn').addEventListener('click', saveNewPass);
  ['curPass', 'newPass', 'newPass2'].forEach((id) => {
    $('#' + id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveNewPass(); } });
  });

  $('#resetPassBtn').addEventListener('click', () => {
    S.admin = false;
    localStorage.removeItem('pwall:admin');
    document.body.classList.remove('is-admin');
    renderHome(true);
    closeAllModals();
    toast('已退出管理員模式', 'ok');
  });

  /* home */
  $('#backBtn').addEventListener('click', () => showHome());
  $('#homeShareBtn').addEventListener('click', () => shareUrl(location.origin + location.pathname));
  $('#newTopicBtn').addEventListener('click', () => openTopicModal('create'));

  $('#topics').addEventListener('click', (e) => {
    if (e.target.closest('#topicAdd')) { openTopicModal('create'); return; }
    const card = e.target.closest('.topic');
    if (!card) return;
    const id = card.dataset.id;
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'edit') openTopicModal('edit', id);
      if (act.dataset.act === 'del') {
        askConfirm('刪除這條題目？', '題目下面所有答案都會一併刪除，無法復原。', async () => {
          closeModal('confirmModal');
          await deleteTopic(id);
        });
      }
      return;
    }
    showTopic(id);
  });
  $('#topics').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.topic');
    if (!card || e.target.closest('[data-act]')) return;
    e.preventDefault();
    showTopic(card.dataset.id);
  });

  /* topic modal */
  $('#topicSave').addEventListener('click', saveTopic);
  $('#topicNameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveTopic(); } });
  $('#topicColors').addEventListener('click', (e) => {
    const sw = e.target.closest('.sw');
    if (!sw) return;
    topicColor = sw.dataset.c;
    paintTopicColors();
  });

  /* topic view */
  $('#renameBoardBtn').addEventListener('click', () => openTopicModal('edit', S.topicId));
  $('#deleteBoardBtn').addEventListener('click', () => {
    askConfirm('刪除這條題目？', '題目下面所有答案都會一併刪除，無法復原。', async () => {
      closeModal('confirmModal');
      await deleteTopic(S.topicId);
    });
  });
  $('#sortBtn').addEventListener('click', () => {
    S.sort = S.sort === 'new' ? 'hot' : 'new';
    localStorage.setItem('pwall:sort', S.sort);
    $('#sortBtn').textContent = S.sort === 'hot' ? '最多讚優先' : '最新優先';
    renderWall(true);
  });
  $('#shareBtn').addEventListener('click', () => {
    shareUrl(location.origin + location.pathname + '#t=' + S.topicId);
  });

  /* composer */
  const ta = $('#postText');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 170) + 'px';
    localStorage.setItem('pwall:draft', ta.value);
    updateComposer();
  });
  ta.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submitPost(); }
  });
  $('#swatches').addEventListener('click', (e) => {
    const sw = e.target.closest('.sw');
    if (!sw) return;
    S.color = sw.dataset.c;
    localStorage.setItem('pwall:color', S.color);
    updateComposer();
  });
  $('#sendBtn').addEventListener('click', submitPost);

  /* wall */
  $('#wall').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const id = card.dataset.id;
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'like') toggleLike(id);
    if (btn.dataset.act === 'del') {
      askConfirm('刪除這張卡片？', '刪除後無法復原。', async () => {
        closeModal('confirmModal');
        await deletePost(id);
      });
    }
  });

  $('#confirmOk').addEventListener('click', () => { if (S.confirmFn) S.confirmFn(); });

  /* export / import */
  $('#exportBtn').addEventListener('click', async () => {
    try {
      const keys = await S.store.listKeys('p:');
      const vals = await mapLimit(keys, 6, (k) => S.store.get(k));
      const posts = {};
      keys.forEach((k, i) => { if (vals[i]) posts[k] = vals[i]; });
      const data = { app: 'discussion-wall', exportedAt: new Date().toISOString(), topics: S.topics, posts: posts };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'discussion-wall-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      toast('已匯出備份', 'ok');
    } catch (e) { toast('匯出失敗', 'err'); }
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const topics = data.topics || data.boards;
      if (!topics || !data.posts) throw new Error('bad');
      await S.store.put(K_TOPICS, topics);
      for (const k of Object.keys(data.posts)) await S.store.put(k, data.posts[k]);
      S.topics = topics;
      await loadStats();
      closeAllModals();
      showHome();
      toast('已還原備份', 'ok');
    } catch (err) { toast('檔案格式不正確', 'err'); }
    e.target.value = '';
  });

  $('#bannerClose').addEventListener('click', () => $('#banner').classList.remove('show'));

  $$('[data-close]').forEach((b) => b.addEventListener('click', closeAllModals));
  $$('.modal-back').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('show'); }));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllModals(); });

  window.addEventListener('popstate', route);
  window.addEventListener('hashchange', route);
}

async function shareUrl(url) {
  try {
    if (navigator.share) { await navigator.share({ title: CONFIG.APP_TITLE, url: url }); return; }
    await navigator.clipboard.writeText(url);
    toast('連結已複製，傳給同學就可以一齊討論', 'ok');
  } catch (e) {
    try { window.prompt('複製這條連結分享出去：', url); } catch (e2) {}
  }
}

/* ---------------- change password ---------------- */
async function refreshAuthInfo() {
  const el = $('#authInfo');
  if (el) el.textContent = await authInfoText();
}

async function saveNewPass() {
  const cur = $('#curPass').value;
  const n1 = $('#newPass').value;
  const n2 = $('#newPass2').value;
  const btn = $('#savePassBtn');
  if (!cur) { toast('請輸入目前密碼', 'err'); return; }
  if (n1.length < 4) { toast('新密碼最少 4 個字元', 'err'); return; }
  if (n1 !== n2) { toast('兩次輸入的新密碼唔一致', 'err'); return; }
  btn.disabled = true;
  try {
    if (!(await checkPass(cur))) { toast('目前密碼不正確', 'err'); return; }
    const salt = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const r = await hashPass(n1, salt);
    await S.store.put(K_AUTH, { v: 1, salt: salt, alg: r.alg, hash: r.hash, epoch: CONFIG.AUTH_EPOCH, updatedAt: Date.now() });
    closeModal('passChangeModal');
    toast('密碼已更新，所有裝置即時生效', 'ok');
    refreshAuthInfo();
  } catch (e) {
    toast('儲存失敗，請重試', 'err');
  } finally { btn.disabled = false; }
}

/* ---------------- init ---------------- */
async function init() {
  applyTheme(localStorage.getItem('pwall:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#appTitle').textContent = CONFIG.APP_TITLE;
  document.title = CONFIG.APP_TITLE + ' · 一起討論';
  $('#swatches').innerHTML = CONFIG.COLORS.map((c) => '<button class="sw" data-c="' + c + '" title="' + c + '"></button>').join('');

  const cloud = makeCloudStore(CONFIG.KVDB_BUCKET);
  const forcedLocal = location.search.indexOf('mode=local') >= 0;
  if (!forcedLocal) {
    try { await cloud.listKeys('cfg:'); S.store = cloud; setStatus('ok', '已連線'); }
    catch (e) { S.store = makeLocalStore(); setStatus('off', '本機模式'); }
  } else { S.store = makeLocalStore(); setStatus('off', '本機模式'); }

  if (S.store.mode === 'local') {
    $('#bannerText').innerHTML = '<b>本機模式</b>：雲端暫時連不上，你貼嘅內容只會儲存在這部裝置。';
    $('#banner').classList.add('show');
  }

  if (S.admin) document.body.classList.add('is-admin');
  $('#nickLabel').textContent = S.name;
  const av = avatarFor(S.name);
  $('#nickAvatar').textContent = av.letter;
  $('#nickAvatar').style.background = av.color;
  $('#sortBtn').textContent = S.sort === 'hot' ? '最多讚優先' : '最新優先';
  $('#storeInfo').textContent = '儲存：' + (S.store.mode === 'cloud' ? '雲端共用（kvdb.io）' : '本機（localStorage）');

  await loadTopics(false);
  await loadStats();
  bindEvents();
  route();
  startPolling();
}

function startPolling() {
  setInterval(async () => {
    if (document.hidden || S.busy) return;
    S.busy = true;
    try {
      S.tick++;
      if (S.tick % 4 === 0) await loadTopics(true);
      if (S.view === 'home') { await loadStats(); renderHome(false); }
      else await loadPosts(false);
    } finally { S.busy = false; }
  }, CONFIG.POLL_MS);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (S.view === 'topic') loadPosts(false);
    else loadStats().then(() => renderHome(false));
  });
  window.addEventListener('online', () => { if (S.view === 'topic') loadPosts(false); });
}

/* restore draft */
(function restoreDraft() {
  const d = localStorage.getItem('pwall:draft');
  if (d) $('#postText').value = d;
})();

init().then(() => {
  updateComposer();
  const ta = $('#postText');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 170) + 'px';
}).catch((e) => {
  console.error(e);
  setStatus('err', '初始化失敗');
  toast('載入失敗，請重新整理', 'err');
});
</script>
</body>
</html>
